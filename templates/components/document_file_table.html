<div class="table-responsive">
    <table class="table table-striped table-hover align-middle table-brand-header">
        <thead>
            <tr><th>Datei</th><th>Zugehörigkeit</th><th>Datum</th></tr>
        </thead>
        <tbody>
            {% for entry in entries %}
                <tr>
                    <td><a href="{{ entry.file.url }}" target="_blank" rel="noopener"><i class="bi bi-file-earmark-text me-1"></i>{{ entry.file.name|slice:"-40:" }}</a></td>
                    <td>{{ entry.label }}</td>
                    <td>{{ entry.date|date:"d.m.Y" }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
