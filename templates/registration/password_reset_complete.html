{% extends "base.html" %}
{% load static %}
{% block title %}Passwort geändert{% endblock %}
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}
{% block content %}
<section class="gradient-form">
    <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-xl-6 col-lg-8">
                <div class="card rounded-3 text-black shadow-lg">
                    <div class="card-body p-md-5 mx-md-4 text-center">

                        <img src="{% static 'img/wd-logo-dark.png' %}" style="width: 185px;" alt="Wonderland ERP Logo">
                        <h4 class="mt-1 mb-4 pb-1">Passwort geändert</h4>

                        <p class="mb-4">Dein neues Passwort wurde gespeichert. Du kannst dich jetzt damit anmelden.</p>

                        <a class="btn btn-primary" href="{% url 'login' %}">Zur Anmeldung</a>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
